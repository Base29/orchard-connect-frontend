name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  # Image name matches ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Set API URL
        id: api-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=${{ secrets.PROD_NEXT_PUBLIC_API_URL || 'https://orchardconnect.pk' }}" >> $GITHUB_OUTPUT
          else
            echo "url=https://demo.orchardconnect.pk" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push Docker Image (Multi-Platform)
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.api-url.outputs.url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflare Tunnel Client
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy to Raspberry Pi via SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Setup SSH configuration with Cloudflare Tunnel ProxyCommand
          cat <<EOF > ~/.ssh/config
          Host raspberrypi
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || '22' }}
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          
          # Get lowercase image name
          IMAGE_NAME_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # SSH and Deploy
          ssh raspberrypi << EOF
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new frontend image with develop tag
            docker pull ghcr.io/${IMAGE_NAME_LOWER}:develop
            
            # Tag it as latest locally so docker-compose uses it
            docker tag ghcr.io/${IMAGE_NAME_LOWER}:develop ghcr.io/${IMAGE_NAME_LOWER}:latest
            
            # Restart only the frontend service
            docker compose up -d frontend
          EOF

  deploy-production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production Server via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Setup SSH configuration
          cat <<EOF > ~/.ssh/config
          Host production
            HostName ${{ secrets.PROD_SSH_HOST }}
            User ${{ secrets.PROD_SSH_USER }}
            Port ${{ secrets.PROD_SSH_PORT || '22' }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
          EOF
          
          # SSH and Deploy
          ssh production << 'EOF'
            cd ${{ secrets.PROD_DEPLOY_PATH }}
            
            # Log in to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull new frontend image
            docker compose pull frontend
            
            # Restart only the frontend service
            docker compose up -d frontend
          EOF
